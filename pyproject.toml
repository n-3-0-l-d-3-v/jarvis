[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Orchestrator agent: intent classification, sensitivity-tier routing, and MCP dispatch across the sibling agent ecosystem (Friday, Ultron, Alfred)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0",
    "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]
voice = ["faster-whisper>=1.0", "sounddevice>=0.4"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["agents.yaml", "providers.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
